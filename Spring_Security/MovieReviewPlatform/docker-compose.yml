version: "3.8"
services:
  db:
    image: postgres:16
    container_name: moviereviews-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moviereviews
      POSTGRES_USER: moviereviews
      POSTGRES_PASSWORD: moviereviews
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: {}
