spring:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
      show-sql: true
  datasource:
    url: jdbc:postgresql://localhost:5435/fibonacci_db
    username: postgres
    password: postgres
    initialize: true
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
